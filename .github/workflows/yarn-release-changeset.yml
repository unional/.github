name: yarn-release-changeset
# Publishes via npm trusted publishing (OIDC). Each package needs a trusted publisher
# registered at npmjs.com/package/<name>/access naming the repo and the *caller*
# workflow's filename.
#
# This works despite Yarn Berry having no trusted-publishing support of its own:
# `changeset publish` picks the publish tool itself, and on @changesets/cli v2 that is
# the npm CLI for everything except pnpm. The npm CLI does support OIDC.
on:
  workflow_call:

permissions:
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  id-token: write
  # Lets changesets/action push the version branch and tags.
  contents: write
  # Lets changesets/action open the "version packages" PR.
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # Trusted publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: yarn
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: yarn version
          publish: yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"
