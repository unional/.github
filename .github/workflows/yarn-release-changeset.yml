name: yarn-release-changeset
# UNAUTHENTICATED PUBLISH ON THIS LINE. `NPM_TOKEN` has been removed from this repo's
# workflows in favour of npm trusted publishing (OIDC), but this workflow cannot reach it.
#
# `changeset publish` picks its own publish tool. On @changesets/cli v2 that was the npm
# CLI for everything except pnpm, so a Yarn Berry repo still got npm's OIDC exchange --
# which is why this workflow IS a clean migration on the v1 line (`main`).
#
# @changesets/cli v3 changed `getPublishTool()`: a yarn repo now gets Yarn Berry's own
# publisher, which has no trusted-publishing support. Since this is the v2 line and v2
# requires CLI v3, publish never reaches the npm CLI here and there is nothing for OIDC
# to hook into.
#
# The publish step will fail with a 401 until either Yarn Berry gains trusted-publishing
# support or this workflow is reworked to publish through the npm CLI. Consumers on Yarn
# Berry should stay on `@v1` for now.
on:
  workflow_call:

permissions:
  # Kept for when a trusted-publishing path exists here; see the header.
  id-token: write
  # Lets changesets/action push the version branch and tags.
  contents: write
  # Lets changesets/action open the "version packages" PR.
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Dependencies
        run: yarn
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: version packages'
          version-script: yarn version
          publish-script: yarn changeset publish

      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"
