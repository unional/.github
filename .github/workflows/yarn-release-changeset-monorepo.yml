name: yarn-release-changeset
# UNAUTHENTICATED PUBLISH. `NPM_TOKEN` has been removed from this repo's workflows, but
# this one publishes with `yarn workspaces foreach npm publish` -- Yarn Berry's own
# publisher, which has no trusted-publishing (OIDC) support. Unlike the other changesets
# workflows it never reaches the npm CLI, so there is nothing here for OIDC to hook into.
#
# The publish step below will fail with a 401 until this workflow is reworked to publish
# through the npm CLI. No consumer of this repo currently calls it.
on:
  workflow_call:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Dependencies
        run: yarn
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: yarn version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: yarn workspaces foreach npm publish --access public && changeset tag
      # - name: Send a Slack notification if a publish happens
      #   if: steps.changesets.outputs.published == 'true'
      #   # You can do something when a publish happens.
      #   run: my-slack-bot send-notification --message "A new version of ${GITHUB_REPOSITORY} was published!"
